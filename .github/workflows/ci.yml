name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The same suite, subprocess proofs included, under Bun's native bun:test —
  # this lane is what keeps the README's "runs on Bun" claim continuously true.
  bun:
    name: bun / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test

  # The same suite again under Deno, which runs it via its native node:test
  # bridge (Deno.test under the hood). --allow-read for the .feature files,
  # --allow-run for the subprocess proofs in test/runner.test.js,
  # --allow-write scoped to fixtures/.manifest-out for the run-manifest tests
  # (the manifest opt-in's documented minimum — nothing wider). This lane
  # keeps the README's "runs on Deno" claim continuously true.
  deno:
    name: deno / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read --allow-env --allow-run --allow-write=fixtures/.manifest-out --no-check

  # The vitest adapter (`gherkin-node-test/vitest`) smoke suite: the bound
  # counter feature must register and pass on a real vitest, guards included.
  # One OS is enough — the adapter is pure registration plumbing; the
  # per-OS/per-runtime behavior lives in the three lanes above.
  vitest:
    name: vitest adapter / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:vitest
      # Strict consumer typecheck (skipLibCheck OFF) of both shipped .d.ts
      # entry points — hand-written vitest.d.ts has no other gate.
      - run: npm run typecheck
